services:
  api:
    build:
      context: ./api
    env_file:
      - ./api/.env
    # Includes LLM_CREDENTIAL_ENCRYPTION_KEY and quota settings from api/.env.
    environment:
      RUNNING_IN_DOCKER: "true"
      DATABASE_URL: postgresql+asyncpg://youtube_preview:${POSTGRES_PASSWORD:-youtube_preview}@postgresql:5432/youtube_preview
      REDIS_URL: redis://redis:6379/0
      LIBRETRANSLATE_URL: http://libretranslate:5000
    command: ["/bin/sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: ./api
    env_file:
      - ./api/.env
    # Includes LLM_CREDENTIAL_ENCRYPTION_KEY and quota settings from api/.env.
    environment:
      RUNNING_IN_DOCKER: "true"
      DATABASE_URL: postgresql+asyncpg://youtube_preview:${POSTGRES_PASSWORD:-youtube_preview}@postgresql:5432/youtube_preview
      REDIS_URL: redis://redis:6379/0
      LIBRETRANSLATE_URL: http://libretranslate:5000
    hostname: worker
    command: ["celery", "-A", "app.workers.tasks.celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.tasks.celery_app inspect ping -d celery@worker --timeout=3 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 25s
    restart: unless-stopped

  postgresql:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: youtube_preview
      POSTGRES_USER: youtube_preview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-youtube_preview}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youtube_preview -d youtube_preview"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  libretranslate:
    image: libretranslate/libretranslate:v1.6.5
    environment:
      LT_DISABLE_WEB_UI: "true"
      LT_LOAD_ONLY: en,zh,zt,ja
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped

volumes:
  postgresql_data:
  redis_data:
