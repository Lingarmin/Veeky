services:
  postgresql:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: youtube_preview
      POSTGRES_USER: youtube_preview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-youtube_preview}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youtube_preview -d youtube_preview"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  libretranslate:
    image: libretranslate/libretranslate:v1.6.5
    environment:
      LT_DISABLE_WEB_UI: "true"
      LT_LOAD_ONLY: en,zh,zt,ja
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped

volumes:
  postgresql_data:
  redis_data:
